# Publishes the site/ folder to GitHub Pages (free) whenever main changes or the daily collect finishes.
# One-time setup: repository Settings -> Pages -> Source: "GitHub Actions".
name: Publish site

on:
  push:
    branches: [main]
    paths: ["site/**"]
  workflow_run:
    workflows: ["Daily collect"]
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
